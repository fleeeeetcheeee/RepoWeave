[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoweave"
version = "0.1.0"
description = "Repository-aware lossless compression and measured policy optimization"
requires-python = ">=3.12"
dependencies = [
  "daytona>=0.225.0",
  "droid-sdk>=0.5.0",
  "langgraph>=1.2.16",
  "langgraph-checkpoint-sqlite>=3.1.2",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "zstandard>=0.23,<1",
]

[project.scripts]
repoweave = "repoweave.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "pytest-asyncio>=1.4.0",
    "langgraph-cli[inmem]>=0.4.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repoweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires an external account and may incur costs",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
